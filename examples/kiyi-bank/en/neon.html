<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#100b22"><title>Shore Bank · Neon</title>
<style>
:root{color-scheme:dark;--paper:#100a24;--outside:#090917;--ink:#faf9ff;--sub:#c7b9da;--line:#49395f;--accent:#c6a7ff;--good:#59ffcf;--warn:#ffa6b8;--dialog:#20152f;--focus:#80eaff;--s:system-ui,"Segoe UI",sans-serif;--n:"Bahnschrift","Segoe UI",sans-serif}
*{box-sizing:border-box}body{margin:0;color:var(--ink);background:var(--outside);font:1rem/1.4 var(--s)}
a{color:inherit;text-decoration:none}button,input{font:inherit;color:inherit}button{background:none;border:0;padding:0;cursor:pointer}button,a,input{-webkit-tap-highlight-color:transparent}
button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid var(--focus);outline-offset:2px}button:active,a:active{opacity:.76}
h1,h2,h3,p,dl,dd{margin:0}.app{max-width:448px;min-height:100dvh;display:flex;flex-direction:column;margin:auto;background:var(--paper);padding-top:env(safe-area-inset-top);container-type:inline-size}
header,.brand,.header-tools,.title-line,.split,.account,.actions,.nav-link,.amount,.btn,.panel-top{display:flex;align-items:center}
header{justify-content:space-between;padding:12px 20px;gap:12px}.brand{font-size:1.42rem;font-weight:700;letter-spacing:-.064em;gap:9px}.mark{display:grid;place-items:center;color:var(--accent)}.mark svg{width:34px;height:30px}.header-tools{gap:4px}.tool{width:44px;min-height:44px;display:grid;place-items:center}.initials{display:grid;place-items:center;width:32px;height:32px;border-radius:50%;font-size:.79rem;font-weight:650;border:1px solid var(--line)}
.ico{height:21px;width:21px;flex:none;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round;vertical-align:middle}.sub{color:var(--sub);font-size:.86rem}
main{flex:1;min-width:0;padding:12px 20px 20px}
.title-line,.split,.panel-top{justify-content:space-between;gap:8px}.title-line h2,.panel-top h2{font-size:1.27rem;letter-spacing:-.04em}.all,.account{min-height:44px;font-size:.84rem;display:inline-flex;align-items:center;gap:5px;color:var(--accent);font-weight:620}.all .ico,.account .ico{width:15px;height:15px}
.amount{align-items:baseline;flex-wrap:wrap;gap:0;line-height:1.08;letter-spacing:-.055em;font:600 clamp(2.65rem,11vw,3.2rem)/1.08 var(--n);font-variant-numeric:tabular-nums;letter-spacing:-.055em}.amount small{font-size:.61em;font-weight:500}.amount .unit{font-size:.48em;margin-left:.24em}
.btn{justify-content:center;gap:8px;min-height:46px;padding:10px 16px;font-weight:630;border-radius:8px}.entry{position:relative;width:100%;text-align:left;display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:10px;min-height:61px}.desc{display:grid;min-width:0;gap:2px}.desc strong{font-size:.96rem;font-weight:615;line-height:1.24}.desc small{font-size:.77rem;color:var(--sub)}
.val{white-space:nowrap;font-variant-numeric:tabular-nums;font-family:var(--n);font-weight:520;letter-spacing:-.023em}.positive{color:var(--good)}
footer{position:sticky;bottom:0;z-index:1;padding-bottom:env(safe-area-inset-bottom);background:var(--paper)}
nav{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));align-items:stretch;padding:0 7px;border-top:1px solid var(--line)}
.nav-link{justify-content:center;flex-direction:column;gap:4px;min-height:61px;font-size:.7rem;color:var(--sub);position:relative}.nav-link[aria-current]{color:var(--accent);font-weight:650}
.page-title{font-size:1.65rem;letter-spacing:-.05em;margin:.4rem 0 1rem}.detail{padding:12px 0;border-bottom:1px solid var(--line);display:grid;gap:3px}.detail dt{font-size:.83rem;color:var(--sub)}.detail dd{font-weight:600;overflow-wrap:anywhere}
dialog{background:var(--dialog);color:var(--ink);border:1px solid var(--line);border-radius:16px 16px 0 0;padding:12px 21px max(25px,env(safe-area-inset-bottom));width:min(100%,448px);max-width:100%;max-height:86dvh;margin:auto auto 0;overflow:auto}
dialog::backdrop{background:#05080db8}.panel-top{margin-bottom:14px;border-bottom:1px solid var(--line);padding-bottom:5px}
.field{display:grid;gap:5px;margin:12px 0;font-size:.9rem}.field input{width:100%;min-height:45px;padding:9px 12px;background:var(--paper);border:1px solid var(--line);border-radius:6px;font-size:1rem}
.wide{width:100%;margin-top:16px;background:var(--accent);color:#0a1021}.error{color:var(--warn);font-size:.86rem}
.note{margin:12px 0;color:var(--sub);font-size:.85rem}.empty{padding:16px 0;color:var(--sub)}
@container(max-width:20rem){.entry{column-gap:6px}.val{font-size:.9rem}.desc strong{font-size:.88rem}main{padding-inline:14px}}
@container(max-width:18rem){.entry{grid-template-columns:minmax(0,1fr);padding-block:10px}.tx-icon{display:none}.val{white-space:normal}.header-tools{gap:0}nav{grid-template-columns:repeat(2,minmax(0,1fr))}.actions,.split,.title-line{flex-wrap:wrap}.hero .split{align-items:flex-start}}
@media(max-height:660px){footer{position:static}}

.app{background:radial-gradient(ellipse at 106% 11%,#361155 0,transparent 45%),radial-gradient(ellipse at 0 53%,#1d1550 0,transparent 41%),#100b22}
header{padding-top:16px}.mark{border-radius:11px;background:linear-gradient(135deg,#613aff,#d13ccb 70%,#ff8dca);width:36px;height:36px;color:white;box-shadow:0 0 16px #b23cf587}.mark svg{width:28px}.header-tools .initials{background:linear-gradient(150deg,#4136ad,#8f248a);border-color:#bc76ea}.bell .ico{filter:drop-shadow(0 0 4px #d385ff)}
.greeting p{color:#b4a1d0;font-size:.79rem}.greeting h1{font-size:1.7rem;letter-spacing:-.055em;line-height:1.25;margin-top:2px}.spark{color:#e1a1ff;text-shadow:0 0 10px #ed60ff}
.hero{position:relative;isolation:isolate;overflow:hidden;margin-top:16px;padding:14px 17px 10px;border:1px solid #bf8cfd;border-radius:21px;background:linear-gradient(118deg,#281441 0%,#3a1259 44%,#58228c 76%,#20317c 100%);box-shadow:0 0 18px #b052ef47,inset 0 0 21px #cc6cfe33}
.hero:before{content:"";position:absolute;inset:0;z-index:-2;background:radial-gradient(ellipse at 95% 80%,#1db7fd60,transparent 42%),repeating-linear-gradient(0deg,transparent 0 6px,#ffaeff0a 7px)}
.hero-art{position:absolute;inset:0;width:100%;height:100%;z-index:-1}
.hero .split{min-height:39px}.acct-type{font-size:.8rem;color:#efe0ff;font-weight:650;display:flex;align-items:center;gap:7px}.acct-type .ico{width:16px;height:16px}
.hero .tool{height:36px;min-height:36px;width:36px;background:#26143db8;color:#f5e4ff;border:1px solid #b37bdd;border-radius:50%}
.hero h2{font-size:.77rem;font-weight:500;color:#f1dcfc;margin:7px 0 3px}.amount{color:white;text-shadow:0 0 14px #e372df76}
.hero-foot{display:flex;align-items:center;justify-content:space-between;margin-top:14px;font:normal .78rem var(--n);color:#e5c7ff}.hero-foot button{color:#fff}
.actions{justify-content:space-between;gap:8px;margin:16px 0 12px}
.quick{flex:1;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:7px;background:linear-gradient(140deg,#301a4d,#21122f);border:1px solid #854b9e;box-shadow:inset 0 0 12px #f443fe12,0 0 9px #ca4dea1e;border-radius:15px;min-height:75px;padding:7px 3px;font-size:.79rem;font-weight:600}
.quick:nth-child(2){background:linear-gradient(140deg,#153557,#17132e);border-color:#3e769e}.quick:nth-child(3){background:linear-gradient(140deg,#3d1746,#231328);border-color:#99547d}
.quick .ico{color:#e4a1ff;filter:drop-shadow(0 0 4px #eb5bff);height:23px;width:23px}.quick:nth-child(2) .ico{color:#80efff;filter:drop-shadow(0 0 4px #32e4ff)}.quick:nth-child(3) .ico{color:#ff9dde;filter:drop-shadow(0 0 4px #ff61cb)}
.title-line h2{color:#f4ddff}.all{color:#dbb1ff}
.rows{display:grid;gap:6px}.entry{border:1px solid #553767;border-radius:12px;background:linear-gradient(100deg,#2a1b3b,#1e122c);padding:7px 10px;min-height:57px}
.tx-icon{display:grid;place-items:center;width:33px;height:33px;border-radius:10px;background:#4c263c;color:#ffaabf}.tx-icon.income{background:#193c47;color:#71ffe7}.tx-icon.market{background:#4c2d27;color:#ffc09a}.tx-icon.music{background:#372754;color:#d5acff}
.val{font-size:.94rem}.positive{text-shadow:0 0 6px #80ffc334}.nav-link[aria-current] .ico{filter:drop-shadow(0 0 5px #bb67ff)}
footer{background:#170f26}nav{border-color:#5d366f}

.amount .unit,.value .currency{margin-left:0;margin-right:.08em}
</style></head><body>
<div class="app"><header><div class="brand"><span class="mark"><svg viewBox="0 0 30 26" fill="none" aria-hidden="true"><path d="M3 15C8 15 9 6 16 6c5 0 7 3 11 1M3 21c7 0 8-9 15-9 4 0 6 2 9 1" stroke="currentColor" stroke-width="3" stroke-linecap="round"/></svg></span>Shore Bank</div><div class="header-tools"><button class="tool bell" data-sheet="notice" aria-label="Notifications"><i data-icon="bell"></i></button><button class="tool" data-sheet="profile" aria-label="Dana Ellis, profile"><span class="initials">DA</span></button></div></header>
<main tabindex="-1"></main>
<footer><nav aria-label="Main menu"><a class="nav-link" href="#ana"><i data-icon="home"></i>Home</a><a class="nav-link" href="#hesaplar"><i data-icon="wallet"></i>Accounts</a><a class="nav-link" href="#kartlar"><i data-icon="card"></i>Cards</a><a class="nav-link" href="#hareketler"><i data-icon="list"></i>Activity</a></nav></footer></div>
<dialog aria-labelledby="sheet-title"><div class="panel-top"><h2 id="sheet-title"></h2><button class="tool" aria-label="Close" data-close><i data-icon="close"></i></button></div><div id="sheet-body"></div></dialog>
<script>
const paths={
 bell:'M5 17h14l-2-3V9a5 5 0 0 0-10 0v5l-2 3Zm5 3h4',home:'m3 10 9-7 9 7v10h-6v-6H9v6H3z',wallet:'M3 8V6a2 2 0 0 1 2-2h13v3M5 7h14a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V9a2 2 0 0 1 2-2Zm16 5h-6v4h6',card:'M3 5h18v14H3zM3 10h18M7 15h4',list:'M8 6h13M8 12h13M8 18h13M3 6h.1M3 12h.1M3 18h.1',
 close:'m6 6 12 12M18 6 6 18',right:'m9 5 7 7-7 7',send:'M5 19 19 5M8 5h11v11',receive:'M19 5 5 19M5 8v11h11',bill:'M5 3l3 1.5L12 3l4 1.5L19 3v18l-3-1.5-4 1.5-4-1.5L5 21V3Zm4 6h6m-6 4h6',eye:'M2 12s3.4-6 10-6 10 6 10 6-3.4 6-10 6S2 12 2 12Zm13 0a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z',off:'m3 3 18 18M4 8l-2 4s3.4 6 10 6c2.2 0 4-.6 5.3-1.3M9 6.4c1-.3 2-.4 3-.4 6.6 0 10 6 10 6l-2 2.6',
 coffee:'M4 8h12v5a5 5 0 0 1-5 5H9a5 5 0 0 1-5-5V8Zm12 1h2a2.5 2.5 0 0 1 0 5h-2M3 21h16m-12-18v2m4-2v2',market:'M4 9h16l-1.5 11h-13L4 9Zm4 0 4-6 4 6m-6 4v3m4-3v3',music:'M9 17V6l10-2v11M9 10l10-2M9 17a3 3 0 1 1-6 0 3 3 0 0 1 6 0Zm10-2a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z',search:'M17 10a7 7 0 1 1-14 0 7 7 0 0 1 14 0Zm-2 5 6 6'
};
function icon(key){return '<svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="'+paths[key]+'"/></svg>'}
document.querySelectorAll('[data-icon]').forEach(el=>el.innerHTML=icon(el.dataset.icon));
const items=[
 {day:21,short:'Today',time:'10:42',name:'Corner Café',type:'Café',cents:-18500,icon:'coffee',color:'coffee'},
 {day:20,short:'Yesterday',time:'09:00',name:'Salary',type:'Incoming transfer',cents:5240000,icon:'receive',color:'income'},
 {day:19,short:'Nov 19',time:'18:16',name:'Fresh Market',type:'Groceries',cents:-76435,icon:'market',color:'market'},
 {day:18,short:'Nov 18',time:'08:30',name:'Spotify Premium',type:'Subscription',cents:-9900,icon:'music',color:'music'},
 {day:17,short:'Nov 17',time:'08:12',name:'City Metro',type:'Transit',cents:-4000,icon:'card',color:'travel'}
];
const balance=8475060;
const format=c=>new Intl.NumberFormat('en-US',{minimumFractionDigits:2,maximumFractionDigits:2}).format(c/100);
const withUnit=c=>'$'+format(c);
const signed=c=>(c>0?'+':'−')+withUnit(Math.abs(c));
const content=document.querySelector('main'),dialog=document.querySelector('dialog'),panel=document.querySelector('#sheet-body');
let hidden=false;
function amountHTML(){const [whole,cents]=format(balance).split('.');return '<p class="amount">'+(hidden?'••••••':'<span class="unit">$</span>'+whole+'<small>.'+cents+'</small>')+'</p>'}
function privacyButton(){return '<button id="privacy" class="tool" aria-label="'+(hidden?'Show':'Hide')+' balance" aria-pressed="'+hidden+'">'+icon(hidden?'off':'eye')+'</button>'}
const operations={send:['Send money','Recipient','send'],request:['Request','From','receive'],pay:['Pay bills','Bill account number','bill']};
function actions(){return '<div class="actions" aria-label="Quick actions">'+Object.entries(operations).map(([key,[label,,symbol]])=>'<button class="quick" data-sheet="'+key+'">'+icon(symbol)+'<span>'+label+'</span></button>').join('')+'</div>'}
function rows(list){if(!list.length)return '<p class="empty" role="status">No matching activity. Try another merchant or type.</p>';
 return list.map(x=>'<button class="entry" data-tx="'+items.indexOf(x)+'"><span class="tx-icon '+x.color+'">'+icon(x.icon)+'</span><span class="desc"><strong>'+x.name+'</strong><small>'+x.short+' · '+x.time+'</small></span><span class="val '+(x.cents>0?'positive':'')+'">'+signed(x.cents)+'</span></button>').join('');
}
function detail(label,value){return '<div class="detail"><dt>'+label+'</dt><dd>'+value+'</dd></div>'}
function show(title,html){document.querySelector('#sheet-title').textContent=title;panel.innerHTML=html;if(!dialog.open)dialog.showModal();dialog.scrollTop=0}
function flow(key){
 const [title,label]=operations[key];show(title,'<form novalidate><label class="field">'+label+'<input name="who" maxlength="80" required></label><label class="field">Amount ($)<input required name="amount" inputmode="decimal" placeholder="0.00"></label><p class="error" role="alert"></p><button class="btn wide">Preview</button></form>');
 const form=panel.querySelector('form');form.onsubmit=e=>{
  e.preventDefault();const who=form.elements.who.value.trim(),raw=form.elements.amount.value.trim();
  const valid=/^(?:\d+|\d{1,3}(?:,\d{3})+)(?:\.\d{1,2})?$/.test(raw);
  const cents=valid?Math.round(Number(raw.replaceAll(',',''))*100):0;
  const error=!who?'Enter the '+label.toLowerCase()+'.':!Number.isSafeInteger(cents)||cents<=0?'Enter an amount above zero, for example 250.50.':key!=='request'&&cents>balance?'That is more than your balance. Enter a smaller amount.':'';
  if(error){panel.querySelector('.error').textContent=error;(!who?form.elements.who:form.elements.amount).focus();return}
  show(title,'<p class="sub">Preview</p><dl>'+detail(label,'<span id="who"></span>')+detail('Amount',withUnit(cents))+'</dl><p class="note">This is a preview on a sample account.</p><button class="btn wide" data-close>Close</button>');panel.querySelector('#who').textContent=who;
 };
}
function sheet(key){
 if(Object.hasOwn(operations,key))return flow(key);
 const data={account:['Account details',detail('Account holder','Dana Ellis')+detail('Account','Checking · 4821')+detail('Available balance',hidden?'••••••':withUnit(balance))],profile:['Profile',detail('Full name','Dana Ellis')+detail('Account type','Sample customer account')],notice:['Notifications',detail('Nov 20 · 09:00','Your salary of '+withUnit(items[1].cents)+' arrived.') ]};
 if(data[key])show(data[key][0],'<dl>'+data[key][1]+'</dl>');
}
function page(){
 const tab=location.hash.slice(1)||'ana';
 const views={ana:dashboard,hesaplar:()=>'<h1 class="page-title">Accounts</h1><dl>'+detail('Checking','Ending in 4821')+detail('Available balance',hidden?'••••••':withUnit(balance))+'</dl><button class="account" data-sheet="account">Account details '+icon('right')+'</button>',
 kartlar:()=>'<h1 class="page-title">Cards</h1><dl>'+detail('Debit card','•••• •••• •••• 4821')+detail('Linked account','Checking')+detail('Status','Active')+'</dl>',
 hareketler:()=>'<h1 class="page-title">Account activity</h1><label class="field">Search activity<input id="search" type="search" placeholder="Merchant or type"></label><div class="rows" id="results">'+rows(items)+'</div>'};
 const selected=Object.hasOwn(views,tab)?tab:'ana';
 content.innerHTML=views[selected]();
 document.querySelectorAll('.nav-link').forEach(link=>{if(link.hash==='#'+selected)link.setAttribute('aria-current','page');else link.removeAttribute('aria-current')});
 document.title='Shore Bank · '+document.querySelector('.nav-link[aria-current]').textContent;
 drawArt();
}
document.addEventListener('click',e=>{
 const b=e.target.closest('button');if(!b)return;
 if(b.hasAttribute('data-close'))return dialog.close();
 if(b.id==='privacy'){hidden=!hidden;page();document.querySelector('#privacy').focus();return}
 if(b.dataset.sheet)return sheet(b.dataset.sheet);
 if(b.hasAttribute('data-tx')){const x=items[Number(b.dataset.tx)];show(x.name,'<dl>'+detail('Amount',signed(x.cents))+detail('Type',x.type)+detail('Date','Nov '+x.day+', 2026 · '+x.time)+detail('Account','Checking · 4821')+'</dl>')}
});
document.addEventListener('input',e=>{if(e.target.id!=='search')return;const q=e.target.value.trim().toLocaleLowerCase('en');document.querySelector('#results').innerHTML=rows(items.filter(x=>(x.name+' '+x.type).toLocaleLowerCase('en').includes(q)))});
dialog.addEventListener('click',e=>{if(e.target!==dialog)return;const r=dialog.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)dialog.close()});
window.addEventListener('hashchange',()=>{if(dialog.open)dialog.close();page();window.scrollTo(0,0);content.focus({preventScroll:true})});
function dashboard(){
 return '<div class="greeting"><p>Saturday, November 21, 2026</p><h1>Good evening, Dana <span class="spark" aria-hidden="true">✧</span></h1></div>'+
 '<section class="hero"><canvas class="hero-art" aria-hidden="true"></canvas><div class="split"><span class="acct-type">'+icon('wallet')+'Checking</span>'+privacyButton()+'</div><h2>Available balance</h2>'+amountHTML()+'<div class="hero-foot"><span>•••• 4821</span><button class="account" data-sheet="account">Account details '+icon('right')+'</button></div></section>'+
 actions()+'<section><div class="title-line"><h2>Recent activity</h2><a class="all" href="#hareketler">See all '+icon('right')+'</a></div><div class="rows">'+rows(items.slice(0,4))+'</div></section>';
}
function drawArt(){
 const canvas=document.querySelector('.hero-art');if(!canvas)return;
 const box=canvas.getBoundingClientRect(),w=box.width,h=box.height,d=Math.min(devicePixelRatio||1,2);if(!w||!h)return;
 canvas.width=Math.round(w*d);canvas.height=Math.round(h*d);
 const g=canvas.getContext('2d');g.scale(d,d);g.translate(w*.86,h*.55);g.rotate(-.46);
 const scale=Math.min(w*.25,97),sine=Math.sin,cosine=Math.cos;
 function point(u,v){const r=.70+.31*cosine(v),x=r*cosine(u),y=r*sine(u),z=.31*sine(v);return [x*scale,(y*.61+z*.82)*scale]}
 function loop(steps,fn){g.beginPath();for(let i=0;i<=steps;i++){const p=fn(i/steps*Math.PI*2);i?g.lineTo(...p):g.moveTo(...p)}g.stroke()}
 g.lineWidth=.72;g.shadowBlur=3;
 const ink=g.createLinearGradient(-scale,-scale,scale,scale);ink.addColorStop(0,'#ff8fff');ink.addColorStop(.43,'#ff8bff');ink.addColorStop(.64,'#b7a2ff');ink.addColorStop(1,'#64f5ff');g.strokeStyle=ink;g.shadowColor='#e15afa';g.globalAlpha=.77;
 for(let j=0;j<46;j++)loop(48,v=>point(j/46*Math.PI*2,v));g.globalAlpha=.87;
 for(let j=0;j<18;j++)loop(90,u=>point(u,j/18*Math.PI*2));g.globalAlpha=.7;g.shadowBlur=4;
 [[-.98,-.6,3],[.9,-.43,2],[-.67,.85,2]].forEach(([x,y,r])=>{g.beginPath();g.moveTo(x*scale-r,y*scale);g.lineTo(x*scale+r,y*scale);g.moveTo(x*scale,y*scale-r);g.lineTo(x*scale,y*scale+r);g.stroke()});
}
window.addEventListener('resize',drawArt);page();
</script></body></html>
