<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0d171d"><title>Kıyı Bank · Gece</title>
<style>
:root{color-scheme:dark;--paper:#100a24;--outside:#090917;--ink:#faf9ff;--sub:#c7b9da;--line:#49395f;--accent:#c6a7ff;--good:#59ffcf;--warn:#ffa6b8;--dialog:#20152f;--focus:#80eaff;--s:system-ui,"Segoe UI",sans-serif;--n:"Bahnschrift","Segoe UI",sans-serif}
*{box-sizing:border-box}body{margin:0;color:var(--ink);background:var(--outside);font:1rem/1.4 var(--s)}
a{color:inherit;text-decoration:none}button,input{font:inherit;color:inherit}button{background:none;border:0;padding:0;cursor:pointer}button,a,input{-webkit-tap-highlight-color:transparent}
button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid var(--focus);outline-offset:2px}button:active,a:active{opacity:.76}
h1,h2,h3,p,dl,dd{margin:0}.app{max-width:448px;min-height:100dvh;display:flex;flex-direction:column;margin:auto;background:var(--paper);padding-top:env(safe-area-inset-top);container-type:inline-size}
header,.brand,.header-tools,.title-line,.split,.account,.actions,.nav-link,.amount,.btn,.panel-top{display:flex;align-items:center}
header{justify-content:space-between;padding:12px 20px;gap:12px}.brand{font-size:1.42rem;font-weight:700;letter-spacing:-.064em;gap:9px}.mark{display:grid;place-items:center;color:var(--accent)}.mark svg{width:34px;height:30px}.header-tools{gap:4px}.tool{width:44px;min-height:44px;display:grid;place-items:center}.initials{display:grid;place-items:center;width:32px;height:32px;border-radius:50%;font-size:.79rem;font-weight:650;border:1px solid var(--line)}
.ico{height:21px;width:21px;flex:none;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round;vertical-align:middle}.sub{color:var(--sub);font-size:.86rem}
main{flex:1;min-width:0;padding:12px 20px 20px}
.title-line,.split,.panel-top{justify-content:space-between;gap:8px}.title-line h2,.panel-top h2{font-size:1.27rem;letter-spacing:-.04em}.all,.account{min-height:44px;font-size:.84rem;display:inline-flex;align-items:center;gap:5px;color:var(--accent);font-weight:620}.all .ico,.account .ico{width:15px;height:15px}
.amount{align-items:baseline;flex-wrap:wrap;gap:0;line-height:1.08;letter-spacing:-.055em;font:600 clamp(2.65rem,11vw,3.2rem)/1.08 var(--n);font-variant-numeric:tabular-nums;letter-spacing:-.055em}.amount small{font-size:.61em;font-weight:500}.amount .unit{font-size:.48em;margin-left:.24em}
.btn{justify-content:center;gap:8px;min-height:46px;padding:10px 16px;font-weight:630;border-radius:8px}.entry{position:relative;width:100%;text-align:left;display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:10px;min-height:61px}.desc{display:grid;min-width:0;gap:2px}.desc strong{font-size:.96rem;font-weight:615;line-height:1.24}.desc small{font-size:.77rem;color:var(--sub)}
.val{white-space:nowrap;font-variant-numeric:tabular-nums;font-family:var(--n);font-weight:520;letter-spacing:-.023em}.positive{color:var(--good)}
footer{position:sticky;bottom:0;z-index:1;padding-bottom:env(safe-area-inset-bottom);background:var(--paper)}
nav{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));align-items:stretch;padding:0 7px;border-top:1px solid var(--line)}
.nav-link{justify-content:center;flex-direction:column;gap:4px;min-height:61px;font-size:.7rem;color:var(--sub);position:relative}.nav-link[aria-current]{color:var(--accent);font-weight:650}
.page-title{font-size:1.65rem;letter-spacing:-.05em;margin:.4rem 0 1rem}.detail{padding:12px 0;border-bottom:1px solid var(--line);display:grid;gap:3px}.detail dt{font-size:.83rem;color:var(--sub)}.detail dd{font-weight:600;overflow-wrap:anywhere}
dialog{background:var(--dialog);color:var(--ink);border:1px solid var(--line);border-radius:16px 16px 0 0;padding:12px 21px max(25px,env(safe-area-inset-bottom));width:min(100%,448px);max-width:100%;max-height:86dvh;margin:auto auto 0;overflow:auto}
dialog::backdrop{background:#05080db8}.panel-top{margin-bottom:14px;border-bottom:1px solid var(--line);padding-bottom:5px}
.field{display:grid;gap:5px;margin:12px 0;font-size:.9rem}.field input{width:100%;min-height:45px;padding:9px 12px;background:var(--paper);border:1px solid var(--line);border-radius:6px;font-size:1rem}
.wide{width:100%;margin-top:16px;background:var(--accent);color:#0a1021}.error{color:var(--warn);font-size:.86rem}
.note{margin:12px 0;color:var(--sub);font-size:.85rem}.empty{padding:16px 0;color:var(--sub)}
@container(max-width:20rem){.entry{column-gap:6px}.val{font-size:.9rem}.desc strong{font-size:.88rem}main{padding-inline:14px}}
@container(max-width:18rem){.entry{grid-template-columns:minmax(0,1fr);padding-block:10px}.tx-icon{display:none}.val{white-space:normal}.header-tools{gap:0}nav{grid-template-columns:repeat(2,minmax(0,1fr))}.actions,.split,.title-line{flex-wrap:wrap}.hero .split{align-items:flex-start}}
@media(max-height:660px){footer{position:static}}

:root{
 --paper:#0d171d;--outside:#071013;--ink:#f0f4f2;--sub:#adbbbf;--line:#334147;--accent:#7cedd4;--good:#8be9d0;--warn:#ffacb5;--focus:#9ff4dd;--dialog:#152329;
 --surface:#15242a;--stroke:#3a4d51;--bar:#72958f;--on-accent:#082c2a
}
:root[data-theme="day"]{
 color-scheme:light;--paper:#f6f8f4;--outside:#e3e9e5;--ink:#15272b;--sub:#495c5d;--line:#c7d2cd;--accent:#006b59;--good:#006b59;--warn:#9f2136;--focus:#005e70;--dialog:#f5f8f5;--surface:#e8efea;--stroke:#bacac2;--bar:#5e7c73;--on-accent:#fff
}
header{border-bottom:1px solid var(--line);padding-block:12px}.mark{color:var(--accent)}.brand{color:var(--ink)}
.initials{width:max(32px,2rem);height:max(32px,2rem)}
.header-tools .tool:has(.initials){width:max(44px,2.25rem)}
main{padding-top:12px}
.summary .split{margin-bottom:8px}.account{font-size:.95rem;font-weight:600;color:var(--ink)}.account-id{font-family:var(--n);font-weight:400;color:var(--sub);margin:0 2px}.account .ico{color:var(--sub)}
.summary h1{font-size:.86rem;font-weight:500;color:var(--sub);margin-bottom:4px}
.amount{font-family:var(--n);font-weight:400;font-size:clamp(3.1rem,14.1vw,4.1rem);letter-spacing:-.07em}.amount small{font-size:.62em;font-weight:400;letter-spacing:-.058em}.amount .unit{color:var(--sub);font-size:.43em;font-weight:400;margin-left:8px}
.spend{width:100%;margin:18px 0 0;padding:10px 12px;display:grid;grid-template-columns:minmax(0,1fr) minmax(90px,32%) 12px;gap:12px;align-items:center;background:var(--surface);text-align:left;border-left:2px solid var(--bar)}
.spend-summary{display:grid;gap:4px;min-width:0}.spend-summary>span{color:var(--sub);font-size:.76rem}.spend-summary strong{font:500 1.12rem var(--n);font-variant-numeric:tabular-nums}.spend>.ico{height:12px;width:12px;color:var(--sub)}
.bars{display:flex;gap:5px;align-items:end}.bar-column{display:flex;flex:1;min-width:0;align-items:center;flex-direction:column;gap:3px;color:var(--sub);font:normal .77rem var(--n)}
.track{height:29px;width:100%;display:flex;align-items:end;border-bottom:1px solid var(--stroke)}.bar{display:block;width:100%;background:var(--bar)}.peak{background:var(--accent)}.hidden-spend{padding:18px 0;color:var(--sub);font-size:.85rem}
.actions{gap:5px;margin:16px 0 18px;display:grid;grid-template-columns:1.45fr 1fr 1fr}.quick{display:flex;justify-content:center;align-items:center;gap:6px;min-height:48px;border-radius:6px;color:var(--ink);font-size:.85rem;font-weight:610}.quick .ico{width:16px;height:16px}.quick:first-child{background:var(--accent);color:var(--on-accent)}.quick:not(:first-child){border:1px solid var(--stroke)}.quick:not(:first-child) .ico{display:none}
.ledger{border-top:1px solid var(--line)}.title-line{padding:6px 0 2px}.title-line h2{font-size:1.2rem}.all{color:var(--sub)}.all .ico{width:13px}
.entry{border-top:1px solid var(--line);min-height:59px;padding:10px 0;gap:12px}.tx-icon{display:grid;place-items:center;width:24px;height:30px;color:var(--sub)}.tx-icon .ico{width:19px;height:19px}.tx-icon.income{color:var(--good)}
.val{font-size:1.01rem;font-weight:450}.desc strong{font-weight:590}.nav-link[aria-current]::before{content:"";position:absolute;top:-1px;background:var(--accent);height:2px;width:27px}
.wide{color:var(--on-accent)}.field select{font:inherit;color:var(--ink);background:var(--paper);border:1px solid var(--stroke);border-radius:6px;min-height:44px;padding:8px 12px}
@media(hover:hover){.account:hover,.all:hover,.nav-link:hover{text-decoration:underline;text-underline-offset:3px}.entry:hover,.quick:not(:first-child):hover{background:var(--surface)}}
@container(max-width:20rem){.actions{gap:4px}.quick{font-size:.77rem}.entry{column-gap:7px}.spend{gap:8px}.spend-summary>span{font-size:.73rem}}
@container(max-width:19rem){.spend{grid-template-columns:1fr}.spend>.ico{display:none}.actions{grid-template-columns:1fr 1fr}.quick:first-child{grid-column:1/-1}.entry{grid-template-columns:minmax(0,1fr) auto}.entry .tx-icon{display:none}.entry .val{grid-column:1/-1}.desc strong{overflow-wrap:anywhere}nav{grid-template-columns:repeat(2,minmax(0,1fr))}.nav-link{min-height:50px}footer{position:static}}

</style></head><body>
<div class="app"><header><div class="brand"><span class="mark"><svg viewBox="0 0 30 26" fill="none" aria-hidden="true"><path d="M3 15C8 15 9 6 16 6c5 0 7 3 11 1M3 21c7 0 8-9 15-9 4 0 6 2 9 1" stroke="currentColor" stroke-width="3" stroke-linecap="round"/></svg></span>Kıyı Bank</div><div class="header-tools"><button class="tool bell" data-sheet="notice" aria-label="Bildirimler"><i data-icon="bell"></i></button><button class="tool" data-sheet="profile" aria-label="Deniz Aydın, profil"><span class="initials">DA</span></button></div></header>
<main tabindex="-1"></main>
<footer><nav aria-label="Ana menü"><a class="nav-link" href="#ana"><i data-icon="home"></i>Ana sayfa</a><a class="nav-link" href="#hesaplar"><i data-icon="wallet"></i>Hesaplar</a><a class="nav-link" href="#kartlar"><i data-icon="card"></i>Kartlar</a><a class="nav-link" href="#hareketler"><i data-icon="list"></i>Hareketler</a></nav></footer></div>
<dialog aria-labelledby="sheet-title"><div class="panel-top"><h2 id="sheet-title"></h2><button class="tool" aria-label="Kapat" data-close><i data-icon="close"></i></button></div><div id="sheet-body"></div></dialog>
<script>
const paths={
 bell:'M5 17h14l-2-3V9a5 5 0 0 0-10 0v5l-2 3Zm5 3h4',home:'m3 10 9-7 9 7v10h-6v-6H9v6H3z',wallet:'M3 8V6a2 2 0 0 1 2-2h13v3M5 7h14a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V9a2 2 0 0 1 2-2Zm16 5h-6v4h6',card:'M3 5h18v14H3zM3 10h18M7 15h4',list:'M8 6h13M8 12h13M8 18h13M3 6h.1M3 12h.1M3 18h.1',
 close:'m6 6 12 12M18 6 6 18',right:'m9 5 7 7-7 7',send:'M5 19 19 5M8 5h11v11',receive:'M19 5 5 19M5 8v11h11',bill:'M5 3l3 1.5L12 3l4 1.5L19 3v18l-3-1.5-4 1.5-4-1.5L5 21V3Zm4 6h6m-6 4h6',eye:'M2 12s3.4-6 10-6 10 6 10 6-3.4 6-10 6S2 12 2 12Zm13 0a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z',off:'m3 3 18 18M4 8l-2 4s3.4 6 10 6c2.2 0 4-.6 5.3-1.3M9 6.4c1-.3 2-.4 3-.4 6.6 0 10 6 10 6l-2 2.6',
 coffee:'M4 8h12v5a5 5 0 0 1-5 5H9a5 5 0 0 1-5-5V8Zm12 1h2a2.5 2.5 0 0 1 0 5h-2M3 21h16m-12-18v2m4-2v2',market:'M4 9h16l-1.5 11h-13L4 9Zm4 0 4-6 4 6m-6 4v3m4-3v3',music:'M9 17V6l10-2v11M9 10l10-2M9 17a3 3 0 1 1-6 0 3 3 0 0 1 6 0Zm10-2a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z',search:'M17 10a7 7 0 1 1-14 0 7 7 0 0 1 14 0Zm-2 5 6 6'
};
function icon(key){return '<svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="'+paths[key]+'"/></svg>'}
document.querySelectorAll('[data-icon]').forEach(el=>el.innerHTML=icon(el.dataset.icon));
const items=[
 {day:21,short:'Bugün',time:'10.42',name:'Minoa Pera',type:'Kafe',cents:-18500,icon:'coffee',color:'coffee'},
 {day:20,short:'Dün',time:'09.00',name:'Maaş ödemesi',type:'Gelen transfer',cents:5240000,icon:'receive',color:'income'},
 {day:19,short:'19 Kas',time:'18.16',name:'Migros',type:'Market',cents:-76435,icon:'market',color:'market'},
 {day:18,short:'18 Kas',time:'08.30',name:'Spotify Premium',type:'Abonelik',cents:-9900,icon:'music',color:'music'},
 {day:17,short:'17 Kas',time:'08.12',name:'Metro İstanbul',type:'Ulaşım',cents:-4000,icon:'card',color:'travel'}
];
const balance=8475060;
const format=c=>new Intl.NumberFormat('tr-TR',{minimumFractionDigits:2,maximumFractionDigits:2}).format(c/100);
const withUnit=c=>format(c)+' ₺';
const signed=c=>(c>0?'+':'−')+withUnit(Math.abs(c));
const content=document.querySelector('main'),dialog=document.querySelector('dialog'),panel=document.querySelector('#sheet-body');
let hidden=false;
function amountHTML(){const [whole,cents]=format(balance).split(',');return '<p class="amount">'+(hidden?'••••••':whole+'<small>,'+cents+'</small><span class="unit">₺</span>')+'</p>'}
function privacyButton(){return '<button id="privacy" class="tool" aria-label="Bakiyeyi '+(hidden?'göster':'gizle')+'" aria-pressed="'+hidden+'">'+icon(hidden?'off':'eye')+'</button>'}
const operations={send:['Para gönder','Alıcı adı','send'],request:['Para iste','Kişi adı','receive'],pay:['Fatura öde','Abone numarası','bill']};
function actions(){return '<div class="actions" aria-label="Hızlı işlemler">'+Object.entries(operations).map(([key,[label,,symbol]])=>'<button class="quick" data-sheet="'+key+'">'+icon(symbol)+'<span>'+label+'</span></button>').join('')+'</div>'}
function rows(list){if(!list.length)return '<p class="empty" role="status">Eşleşen hareket yok. İş yeri adını veya işlem türünü değiştirerek ara.</p>';
 return list.map(x=>'<button class="entry" data-tx="'+items.indexOf(x)+'"><span class="tx-icon '+x.color+'">'+icon(x.cents>0?'receive':'send')+'</span><span class="desc"><strong>'+x.name+'</strong><small>'+x.short+' · '+x.time+'</small></span><span class="val '+(x.cents>0?'positive':'')+'">'+signed(x.cents)+'</span></button>').join('');
}
function detail(label,value){return '<div class="detail"><dt>'+label+'</dt><dd>'+value+'</dd></div>'}
function show(title,html){document.querySelector('#sheet-title').textContent=title;panel.innerHTML=html;if(!dialog.open)dialog.showModal();dialog.scrollTop=0}
function flow(key){
 const [title,label]=operations[key];show(title,'<form novalidate><label class="field">'+label+'<input name="who" maxlength="80" required></label><label class="field">Tutar (₺)<input required name="amount" inputmode="decimal" placeholder="0,00"></label><p class="error" role="alert"></p><button class="btn wide">İşlemi önizle</button></form>');
 const form=panel.querySelector('form');form.onsubmit=e=>{
  e.preventDefault();const who=form.elements.who.value.trim(),raw=form.elements.amount.value.trim();
  const valid=/^(?:\d+|\d{1,3}(?:\.\d{3})+)(?:,\d{1,2})?$/.test(raw);
  const cents=valid?Math.round(Number(raw.replaceAll('.','').replace(',','.'))*100):0;
  const error=!who?label+' gir.':!Number.isSafeInteger(cents)||cents<=0?'Sıfırdan büyük bir tutar gir. Örneğin 250,50.':key!=='request'&&cents>balance?'Tutar bakiyeyi aşıyor. Daha düşük bir tutar gir.':'';
  if(error){panel.querySelector('.error').textContent=error;(!who?form.elements.who:form.elements.amount).focus();return}
  show(title,'<p class="sub">İşlem önizlemesi</p><dl>'+detail(label,'<span id="who"></span>')+detail('Tutar',withUnit(cents))+'</dl><p class="note">Bu işlem örnek hesapta önizleniyor.</p><button class="btn wide" data-close>Kapat</button>');panel.querySelector('#who').textContent=who;
 };
}
function sheet(key){
 if(Object.hasOwn(operations,key))return flow(key);
 const data={account:['Hesap bilgileri',detail('Hesap sahibi','Deniz Aydın')+detail('Hesap','Vadesiz TL · 4821')+detail('Kullanılabilir bakiye',hidden?'••••••':withUnit(balance))],profile:['Profil',detail('Ad soyad','Deniz Aydın')+detail('Hesap türü','Örnek müşteri hesabı')],notice:['Bildirimler',detail('20 Kasım · 09.00','Hesabına '+withUnit(items[1].cents)+' maaş ödemesi geldi.') ]};
 if(data[key])show(data[key][0],'<dl>'+data[key][1]+'</dl>');
}
function page(){
 const tab=location.hash.slice(1)||'ana';
 const views={ana:dashboard,hesaplar:()=>'<h1 class="page-title">Hesaplar</h1><dl>'+detail('Vadesiz TL','Hesap sonu 4821')+detail('Kullanılabilir bakiye',hidden?'••••••':withUnit(balance))+'</dl><button class="account" data-sheet="account">Hesap bilgileri '+icon('right')+'</button>',
 kartlar:()=>'<h1 class="page-title">Kartlar</h1><dl>'+detail('Banka kartı','•••• •••• •••• 4821')+detail('Bağlı hesap','Vadesiz TL')+detail('Durum','Kullanıma açık')+'</dl>',
 hareketler:()=>'<h1 class="page-title">Hesap hareketleri</h1><label class="field">Hareket ara<input id="search" type="search" placeholder="İş yeri veya işlem türü"></label><div class="rows" id="results">'+rows(items)+'</div>'};
 const selected=Object.hasOwn(views,tab)?tab:'ana';
 content.innerHTML=views[selected]();
 document.querySelectorAll('.nav-link').forEach(link=>{if(link.hash==='#'+selected)link.setAttribute('aria-current','page');else link.removeAttribute('aria-current')});
 document.title='Kıyı Bank · '+document.querySelector('.nav-link[aria-current]').textContent;
}
document.addEventListener('click',e=>{
 const b=e.target.closest('button');if(!b)return;
 if(b.hasAttribute('data-close'))return dialog.close();
 if(b.id==='privacy'){hidden=!hidden;page();document.querySelector('#privacy').focus();return}
 if(b.dataset.sheet)return sheet(b.dataset.sheet);
 if(b.hasAttribute('data-tx')){const x=items[Number(b.dataset.tx)];show(x.name,'<dl>'+detail('Tutar',signed(x.cents))+detail('İşlem türü',x.type)+detail('İşlem tarihi',x.day+' Kasım 2026 · '+x.time)+detail('Hesap','Vadesiz TL · 4821')+'</dl>')}
});
document.addEventListener('input',e=>{if(e.target.id!=='search')return;const q=e.target.value.trim().toLocaleLowerCase('tr');document.querySelector('#results').innerHTML=rows(items.filter(x=>(x.name+' '+x.type).toLocaleLowerCase('tr').includes(q)))});
dialog.addEventListener('click',e=>{if(e.target!==dialog)return;const r=dialog.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)dialog.close()});
window.addEventListener('hashchange',()=>{if(dialog.open)dialog.close();page();window.scrollTo(0,0);content.focus({preventScroll:true})});
const weekdays=[...items].reverse().map(tx=>({day:tx.day,cost:Math.max(0,-tx.cents)}));
const spent=weekdays.reduce((sum,day)=>sum+day.cost,0);
const peak=Math.max(...weekdays.map(d=>d.cost));
function spending(){
 const bars=weekdays.map(d=>'<span class="bar-column"><span class="track"><i class="bar'+(d.cost===peak?' peak':'')+'" style="height:'+Math.round(100*d.cost/peak)+'%"></i></span><span>'+d.day+'</span></span>').join('');
 return '<button class="spend" data-spend aria-label="17–21 Kasım günlük harcamalarını incele"><span class="spend-summary"><span>17–21 Kasım harcaması</span><strong>'+withUnit(spent)+'</strong></span><span class="bars" aria-hidden="true">'+bars+'</span>'+icon('right')+'</button>';
}
function dashboard(){
 return '<section class="summary"><div class="split"><button class="account" data-sheet="account" aria-label="Vadesiz TL, sonu 4821, hesap bilgileri">Vadesiz TL <span class="account-id">/ 4821</span>'+icon('right')+'</button>'+privacyButton()+'</div><h1>Kullanılabilir bakiye</h1>'+amountHTML()+(hidden?'<p class="hidden-spend">Harcama özeti gizli.</p>':spending())+'</section>'+
 actions()+'<section class="ledger"><div class="title-line"><h2>Son hareketler</h2><a class="all" href="#hareketler">'+icon('search')+' Hareket ara</a></div><div class="rows">'+rows(items)+'</div></section>';
}
function addSettings(){
 const display=document.createElement('label');display.className='field';display.innerHTML='Görünüm<select id="appearance"><option value="night">Gece</option><option value="day">Açık</option></select>';
 panel.appendChild(display);const select=display.querySelector('select');select.value=document.documentElement.dataset.theme==='day'?'day':'night';
 select.onchange=()=>{document.documentElement.dataset.theme=select.value;try{localStorage.setItem('kiyi-neon-appearance',select.value)}catch{}};
}
document.addEventListener('click',e=>{
 if(e.target.closest('button[data-spend]'))show('Günlük harcamalar','<p class="sub">17–21 Kasım 2026 · Vadesiz TL</p><dl>'+detail('Toplam harcama',withUnit(spent))+weekdays.map(d=>detail(d.day+' Kasım',withUnit(d.cost))).join('')+'</dl>');
 if(e.target.closest('button[data-sheet="profile"]'))addSettings();
});
try{if(localStorage.getItem('kiyi-neon-appearance')==='day')document.documentElement.dataset.theme='day'}catch{}
page();
</script></body></html>
