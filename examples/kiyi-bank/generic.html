<!DOCTYPE html>
<html lang="tr">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f8f9fc">
<title>Kıyı Bank · Mobil</title>
<style>
*{box-sizing:border-box} :root{color-scheme:light;--text:#161e39;--muted:#596681;--blue:#2446c7;--rule:#e6eaf2}
body{margin:0;background:#e9ecf3;font:15px/1.4 Inter,"Segoe UI",Arial,sans-serif;color:var(--text)}
button,input{font:inherit}button{border:0;background:none;color:inherit;cursor:pointer}button:focus-visible,input:focus-visible{outline:3px solid #617cfc;outline-offset:3px}
button:active{opacity:.8}.app{max-width:440px;min-height:100dvh;margin:auto;background:#f8f9fc;display:flex;flex-direction:column}
header,.brand,.account-type,.row,.navbtn,.line,.profile,.actions,.section-title,.account-foot{display:flex;align-items:center}
header{padding:23px 23px 12px;justify-content:space-between}.brand{gap:9px;font-weight:750;font-size:22px;letter-spacing:-1.1px}.brandmark{width:33px;height:33px;border-radius:10px;background:var(--blue);display:grid;place-items:center;color:white}.brandmark svg{width:24px}
.tools{display:flex;gap:10px;align-items:center}.round{height:36px;width:36px;display:grid;place-items:center;padding:0;background:white;border:1px solid var(--rule);border-radius:50%}.avatar{background:#e2e9ff;color:#2c4386;font-size:13px;font-weight:700;border:0}.ico{width:21px;height:21px;display:block;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
main{padding:19px 22px 24px;flex:1}.date{font-size:13px;color:var(--muted);margin:0 0 2px}h1,h2,p{margin:0}h1{font-size:29px;line-height:1.25;letter-spacing:-1.15px;font-weight:680}h2{font-size:19px;line-height:1.25;letter-spacing:-.55px}
.balance{margin:19px 0 17px;background:#1836a9;color:white;position:relative;isolation:isolate;overflow:hidden;border-radius:22px;padding:20px;min-height:187px;display:flex;flex-direction:column;justify-content:space-between}.art{position:absolute;right:0;bottom:0;inset:0;width:100%;height:100%;z-index:-1}.line,.account-foot,.section-title{justify-content:space-between}.account-type{gap:7px;font-size:13px;font-weight:590}.account-type .ico{width:17px;height:17px}.eye{color:white;background:#ffffff17;border:1px solid #ffffff36}.eye .ico{width:18px}.balance-label{font-size:13px;color:#e3e9ff;margin:5px 0 1px}.amount{font-size:39px;letter-spacing:-1.6px;font-weight:660;line-height:1.15;font-variant-numeric:tabular-nums}.amount small{font-size:.65em;font-weight:500}.account-foot{margin-top:18px;font-size:12px;color:#eef1ff}.account-foot button{padding:4px 0 4px 8px;display:flex;align-items:center;gap:4px;color:white;font-weight:600}.account-foot .ico{width:13px;height:13px}
.actions{justify-content:space-around;background:white;border:1px solid var(--rule);border-radius:19px;padding:13px 6px}.actions button{min-width:70px;display:grid;justify-items:center;gap:6px;font-size:12px;font-weight:600}.action-icon{display:grid;place-items:center;background:#ecf0ff;color:var(--blue);height:39px;width:39px;border-radius:13px}
.section-title{margin:25px 0 12px}.section-title button{color:var(--blue);font-size:13px;font-weight:650;padding:6px 0 6px 8px}.ledger{background:white;border:1px solid var(--rule);border-radius:19px;padding:0 14px}.row{width:100%;text-align:left;padding:13px 0;gap:11px}.row+.row{border-top:1px solid var(--rule)}.merchant{width:37px;height:37px;display:grid;place-items:center;border-radius:12px;flex:none}.coffee{background:#f6e8de;color:#895329}.income{background:#dff1e8;color:#257253}.market{background:#fae7e4;color:#ba5147}.music{background:#ede8fa;color:#7751ac}.row-copy{display:grid;gap:2px}.row strong{font-size:14px;font-weight:620}.row-copy small{color:var(--muted);font-size:12px}.val{margin-left:auto;font-weight:650;font-size:14px;white-space:nowrap;font-variant-numeric:tabular-nums}.plus{color:#177049}
nav{position:sticky;bottom:0;background:#fff;display:flex;border-top:1px solid var(--rule);padding:9px 8px max(10px,env(safe-area-inset-bottom));justify-content:space-around;z-index:2}.navbtn{flex:1;flex-direction:column;gap:4px;font-size:11px;color:var(--muted);padding:3px}.navbtn.active{color:var(--blue);font-weight:700}.navbtn.active .ico{stroke-width:2.1}
dialog{width:min(390px,calc(100% - 28px));border:0;border-radius:22px;padding:23px;color:var(--text);box-shadow:0 15px 70px #0b174139;max-height:82dvh;overflow:auto}dialog::backdrop{background:#10193365}dialog .line{margin-bottom:17px}dialog p,dialog li{margin:9px 0}dialog p{color:var(--muted)}dialog .row{font-size:14px}dialog label{display:grid;margin:12px 0;gap:4px;font-size:13px;font-weight:600}input{width:100%;border-radius:9px;border:1px solid #c8cfdf;padding:10px}.primary{width:100%;border-radius:11px;background:var(--blue);color:white;font-weight:600;padding:11px;margin-top:8px}.only{margin-top:20px}
@media(max-width:360px){header{padding-inline:15px}main{padding-inline:14px}.actions button{min-width:60px}.row{gap:7px}.ledger{padding:0 10px}}
@media(min-width:600px){.app{box-shadow:0 0 65px #26335413}}
</style>
<div class="app">
 <header><div class="brand"><span class="brandmark"><svg viewBox="0 0 30 26" fill="none" aria-hidden="true"><path d="M3 15C8 15 9 6 16 6c5 0 7 3 11 1M3 21c7 0 8-9 15-9 4 0 6 2 9 1" stroke="currentColor" stroke-width="3" stroke-linecap="round"/></svg></span>Kıyı Bank</div><div class="tools"><button class="round" data-view="Bildirimler" aria-label="Bildirimler" data-icon="bell"></button><button class="round avatar" aria-label="Profil" data-view="Profil">DA</button></div></header>
 <main><p class="date">21 Kasım 2026, Cumartesi</p><h1>Merhaba, Deniz</h1>
 <section class="balance" aria-label="Hesap özeti"><canvas class="art" aria-hidden="true"></canvas><div class="line"><span class="account-type"><i data-icon="wallet"></i>Vadesiz TL</span><button class="round eye" aria-pressed="false" aria-label="Bakiyeyi gizle" data-icon="eye"></button></div><div><p class="balance-label">Kullanılabilir bakiye</p><p class="amount">₺84.750<small>,60</small></p></div><div class="account-foot"><span>•••• 4821</span><button data-view="Hesap bilgileri">Hesap bilgileri <i data-icon="right"></i></button></div></section>
 <div class="actions" aria-label="Hızlı işlemler"><button data-view="Para gönder"><span class="action-icon" data-icon="send"></span>Para gönder</button><button data-view="Para iste"><span class="action-icon" data-icon="receive"></span>Para iste</button><button data-view="Fatura öde"><span class="action-icon" data-icon="bill"></span>Fatura öde</button><button data-view="Kartlarım"><span class="action-icon" data-icon="card"></span>Kartlarım</button></div>
 <div class="section-title"><h2>Son hareketler</h2><button data-view="Hesap hareketleri">Tümü</button></div><div class="ledger" id="latest"></div>
 </main>
 <nav aria-label="Ana menü"><button class="navbtn active" aria-current="page" data-home><i data-icon="home"></i>Ana sayfa</button><button class="navbtn" data-view="Hesaplar"><i data-icon="wallet"></i>Hesaplar</button><button class="navbtn" data-view="Kartlarım"><i data-icon="card"></i>Kartlar</button><button class="navbtn" data-view="Hesap hareketleri"><i data-icon="activity"></i>Hareketler</button></nav>
</div>
<dialog id="sheet" aria-labelledby="sheet-title"><div class="line"><h2 id="sheet-title"></h2><button class="round" data-close aria-label="Kapat" data-icon="close"></button></div><div id="sheet-body"></div></dialog>
<script>
const paths={bell:'M5 17h14l-2-3V9a5 5 0 0 0-10 0v5l-2 3Zm5 3h4',wallet:'M3 8V6a2 2 0 0 1 2-2h13v3M4 7h15a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V9a2 2 0 0 1 1-2Zm17 5h-6v4h6',eye:'M2 12s3.4-6 10-6 10 6 10 6-3.4 6-10 6S2 12 2 12Zm13 0a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z',off:'m3 3 18 18M4 8l-2 4s3.4 6 10 6c2.2 0 4-.6 5.3-1.3M9 6.4c1-.3 2-.4 3-.4 6.6 0 10 6 10 6l-2 2.6',right:'m9 5 7 7-7 7',send:'M5 19 19 5M8 5h11v11',receive:'M19 5 5 19M5 8v11h11',bill:'M5 3l2 1.5L9.5 3 12 4.5 14.5 3 17 4.5 19 3v18l-3-1.5-4 1.5-4-1.5L5 21V3Zm4 6h6m-6 4h6',card:'M3 5h18v14H3zM3 10h18M7 15h4',home:'m3 10 9-7 9 7v10h-6v-6H9v6H3z',activity:'M4 6h16M4 12h11M4 18h14',coffee:'M4 8h12v5a5 5 0 0 1-5 5H9a5 5 0 0 1-5-5V8Zm12 1h2a2.5 2.5 0 0 1 0 5h-2M3 21h16m-12-18v2m4-2v2',market:'M4 9h16l-1.5 11h-13L4 9Zm4 0 4-6 4 6m-6 4v3m4-3v3',music:'M9 17V6l10-2v11M9 10l10-2M9 17a3 3 0 1 1-6 0 3 3 0 0 1 6 0Zm10-2a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z',close:'m6 6 12 12M18 6 6 18'};
function icon(k){return '<svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="'+paths[k]+'"/></svg>'}document.querySelectorAll('[data-icon]').forEach(e=>e.innerHTML=icon(e.dataset.icon));
const items=[
 ['Minoa Pera','Kafe','Bugün, 10.42','−₺185,00','coffee','coffee'],
 ['Maaş ödemesi','Gelen transfer','Dün, 09.00','+₺52.400,00','income','receive'],
 ['Migros','Market','19 Kas, 18.16','−₺764,35','market','market'],
 ['Spotify Premium','Abonelik','18 Kas, 08.30','−₺99,00','music','music'],
 ['Metro İstanbul','Ulaşım','17 Kas, 08.12','−₺40,00','coffee','card']];
function rows(list){return list.map(x=>'<button class="row" data-tx="'+items.indexOf(x)+'"><span class="merchant '+x[4]+'">'+icon(x[5])+'</span><span class="row-copy"><strong>'+x[0]+'</strong><small>'+x[2]+'</small></span><span class="val '+(x[4]==='income'?'plus':'')+'">'+x[3]+'</span></button>').join('')}
document.querySelector('#latest').innerHTML=rows(items.slice(0,4));
const canvas=document.querySelector('canvas');
function draw(){const box=canvas.getBoundingClientRect(),d=window.devicePixelRatio||1,w=box.width,h=box.height;canvas.width=w*d;canvas.height=h*d;const c=canvas.getContext('2d');c.scale(d,d);const g=c.createLinearGradient(0,0,w,h);g.addColorStop(0,'#17318d');g.addColorStop(.55,'#2446c6');g.addColorStop(1,'#4071de');c.fillStyle=g;c.fillRect(0,0,w,h);
 c.save();c.translate(w*.93,h*.73);c.rotate(-.48);for(let j=0;j<90;j++){c.beginPath();const r=10+j*2.7;for(let i=0;i<=500;i++){const a=i/500*Math.PI*2,rad=r*(1+.145*Math.sin(3*a+j*.017)+.14*Math.cos(2*a-j*.011)+.05*Math.sin(5*a));const x=Math.cos(a)*rad*1.08,y=Math.sin(a)*rad*.74;i?c.lineTo(x,y):c.moveTo(x,y)}c.strokeStyle='rgba(177,219,255,'+(.37-.002*j)+')';c.lineWidth=.8;c.stroke()}c.restore();
 const fade=c.createLinearGradient(0,0,w,0);fade.addColorStop(0,'#19348ffa');fade.addColorStop(.41,'#1d3baabc');fade.addColorStop(.71,'#294bc100');c.fillStyle=fade;c.fillRect(0,0,w,h)}
new ResizeObserver(draw).observe(canvas);
const dialog=document.querySelector('dialog'),body=document.querySelector('#sheet-body'),amount=document.querySelector('.amount');let hidden=false;
function show(title,content){document.querySelector('#sheet-title').textContent=title;body.innerHTML=content;if(!dialog.open)dialog.showModal();dialog.scrollTop=0}
function openView(title){const bal=hidden?'••••••':'₺84.750,60';const views={'Hesap hareketleri':rows(items),'Hesap bilgileri':'<p>Hesap sahibi</p><strong>Deniz Aydın</strong><p>Vadesiz TL · Hesap sonu 4821</p><p>Kullanılabilir bakiye</p><strong>'+bal+'</strong>','Hesaplar':'<button class="row" data-view="Hesap bilgileri"><span class="merchant income">'+icon('wallet')+'</span><span>Vadesiz TL · 4821</span><strong class="val">'+bal+'</strong></button>','Kartlarım':'<p>Kıyı Bank banka kartı</p><strong>•••• •••• •••• 4821</strong><p>Durum · Kullanıma açık</p>','Profil':'<p>Hesap sahibi</p><strong>Deniz Aydın</strong>','Bildirimler':'<strong>Maaş ödemen hesabına geçti.</strong><p>20 Kasım · 09.00</p><p>Vadesiz TL hesabına ₺52.400,00 yatırıldı.</p>'};
 if(views[title])return show(title,views[title]);
 const label=title==='Fatura öde'?'Abone numarası':title==='Para iste'?'Kişi adı':'Alıcı adı';
 show(title,'<form><label>'+label+'<input name="receiver" required maxlength="60"></label><label>Tutar (₺)<input name="amount" type="number" min="0.01" step="0.01" required inputmode="decimal"></label><button class="primary">Önizle</button></form>');const form=body.querySelector('form');form.onsubmit=e=>{e.preventDefault();const who=form.elements.receiver.value,value=Number(form.elements.amount.value).toLocaleString('tr-TR',{style:'currency',currency:'TRY'});show(title,'<p>İşlem önizlemesi</p><strong></strong><p>Bu işlem bir demo önizlemesidir.</p><button class="primary" data-close>Kapat</button>');body.querySelector('strong').textContent=who+' · '+value}}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.classList.contains('eye')){hidden=!hidden;b.setAttribute('aria-pressed',hidden);b.setAttribute('aria-label',hidden?'Bakiyeyi göster':'Bakiyeyi gizle');b.innerHTML=icon(hidden?'off':'eye');amount.innerHTML=hidden?'••••••':'₺84.750<small>,60</small>'}else if(b.hasAttribute('data-close'))dialog.close();else if(b.hasAttribute('data-home'))window.scrollTo({top:0,behavior:'smooth'});else if(b.hasAttribute('data-tx')){const x=items[+b.dataset.tx];show(x[0],'<strong>'+x[3]+'</strong><p>'+x[1]+' · '+x[2]+'</p><p>Vadesiz TL · •••• 4821</p>')}else if(b.dataset.view)openView(b.dataset.view)});dialog.addEventListener('click',e=>{if(e.target===dialog){const r=dialog.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)dialog.close()}});
</script>
</html>
